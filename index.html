<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F766E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RH Bénin">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js" defer></script>
<title>Espace Personnel — RH Bénin</title>
<style>
:root{--bg:#F4F6F9;--card:#fff;--ink:#14213D;--mut:#5B6678;--line:#DCE2EA;--acc:#0F766E;--on:#fff;--ok:#157347;--okb:#E3F4EA;--wa:#9A5B00;--wab:#FFF1D6;--ko:#B3261E;--kob:#FBE4E2}
@media(prefers-color-scheme:dark){:root{--bg:#0E1626;--card:#16213A;--ink:#EAF0FA;--mut:#9AA8C0;--line:#2A3858;--acc:#35B5A8;--on:#06201D;--ok:#6CD9A0;--okb:#173A2B;--wa:#F2B75B;--wab:#3A2D12;--ko:#FF9A92;--kob:#3F1A18}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:820px;margin:0 auto;padding:14px}
header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
header img{width:38px;height:38px;border-radius:9px}
header h1{font-size:17px;margin:0}header .sub{font-size:12px;color:var(--mut)}
header .out{margin-left:auto}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--mut);padding:8px 13px;border-radius:99px;font:inherit;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--acc);color:var(--on);border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
h2{font-size:16px;margin:0 0 10px}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:9px}
input,select,textarea{display:block;width:100%;margin-top:3px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.btn{border:0;background:var(--acc);color:var(--on);font:inherit;font-weight:600;padding:9px 14px;border-radius:8px;cursor:pointer}
.btn.s{background:none;border:1px solid var(--line);color:var(--ink)}.btn.ko{background:var(--kob);color:var(--ko)}.btn.sm{padding:6px 10px;font-size:13px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.it:first-of-type{border-top:0}.it b{display:block}.sub{color:var(--mut);font-size:13px}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
.w{background:var(--wab);color:var(--wa)}.o{background:var(--okb);color:var(--ok)}.k{background:var(--kob);color:var(--ko)}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px}.kpi div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}.kpi strong{font-size:22px;display:block}
.note{background:var(--wab);color:var(--wa);padding:8px 10px;border-radius:8px;font-size:13px;margin-bottom:10px}
.login{max-width:380px;margin:9vh auto 0}.login img{width:72px;border-radius:16px;display:block;margin:0 auto 10px}.login h1{text-align:center;font-size:20px;margin:0 0 4px}.login p{text-align:center;color:var(--mut);margin:0 0 16px}
.msg{padding:9px 11px;border-radius:8px;margin-bottom:10px;font-size:14px}.msg.e{background:var(--kob);color:var(--ko)}.msg.i{background:var(--okb);color:var(--ok)}
.modal{position:fixed;inset:0;background:rgba(10,15,30,.6);display:none;align-items:center;justify-content:center;padding:14px;z-index:20}.modal.open{display:flex}
.sheet{background:#fff;color:#14213D;border-radius:6px;width:100%;max-width:540px;max-height:92vh;overflow:auto;padding:22px}
.sheet h3{margin:0 0 3px;font-size:17px;text-align:center}.sheet hr{border:0;border-top:2px solid #14213D;margin:10px 0 14px}
.sheet table{width:100%;border-collapse:collapse;font-size:14px}.sheet td,.sheet th{padding:6px 4px;border-bottom:1px solid #E3E8F0;text-align:left}.sheet td:last-child{text-align:right;font-weight:600}
.sign{margin-top:20px;text-align:right;font-size:12px;color:#445}.sign svg{display:block;margin-left:auto}
.scroll{overflow-x:auto}
.sheet.bul{max-width:720px;font-size:13px;padding:20px}
.bul h3{text-align:left;font-size:24px;margin:6px 0}.bul .top{display:flex;justify-content:space-between;gap:10px;font-size:12px}
.bul .box{border:1px solid #14213D;border-radius:14px;padding:8px 12px;margin:8px 0;line-height:1.5}
.bul .hd{display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.sheet.bul table{border:1px solid #14213D;margin:10px 0}.sheet.bul td,.sheet.bul th{border:1px solid #14213D;padding:6px 8px;text-align:left;font-weight:400}
.sheet.bul th{text-align:center;font-weight:700;background:#EEF1F5}.sheet.bul td.n,.sheet.bul td.n:last-child{text-align:center}.sheet.bul td:last-child{text-align:left;font-weight:400}
.sheet.bul td.b,.sheet.bul th.b{font-weight:700}
.qr svg{width:100%;height:auto;display:block}body.big{font-size:18px}
.att p{line-height:1.7;font-size:14px;text-align:justify}.dv{border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px}
@media print{body *{visibility:hidden}.sheet,.sheet *{visibility:visible}.modal{position:static;background:none;padding:0}.sheet{position:absolute;left:0;top:0;max-width:none;width:100%}.noprint{display:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<script src="config.js"></script>
<script>
var MOIS=["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
var U=null,TAB="",D={},MSG=null;if(localStorage.getItem("big"))document.body.classList.add("big");
function unread(){return(D.nots||[]).filter(function(n){return n.lu=="NON"}).length}
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function fd(s){if(!s)return"";var p=String(s).slice(0,10).split("-");return p[2]+"/"+p[1]+"/"+p[0]}
function fm(n){return Number(n||0).toLocaleString("fr-FR")+" F"}
function pill(s){var m={VALIDEE:["o","Validée"],REFUSEE:["k","Refusée"],SOUMISE:["w","En attente RH"],ANNULEE:["k","Annulée"],VALIDE:["o","Validé"],SUSPENDU:["k","Suspendu"],EN_ATTENTE:["w","À décider"]}[s]||["w",s];return'<span class="pill '+m[0]+'">'+m[1]+'</span>'}
function call(action,data){
  var API=(window.RH_CONFIG&&RH_CONFIG.API_URL&&RH_CONFIG.API_URL.indexOf("http")===0)?RH_CONFIG.API_URL:"https://script.google.com/macros/s/AKfycbzZZbANqXL_TPgNBdrl3ptMjycanc8iHi-ZKNfnSlM7ywtGg3tVQ2Xm89yswRhF_4ay/exec";
  return fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({action:action,token:U&&U.token},data||{}))})
   .then(function(r){return r.json()}).then(function(j){if(!j.ok)throw new Error(j.erreur);return j.data});
}
function flash(t,err){MSG={t:t,e:err};render()}
function run(p,ok){return p.then(function(r){if(ok)MSG={t:ok};return r}).catch(function(e){MSG={t:e.message,e:1};if(/Session expirée/.test(e.message)){U=null;sessionStorage.clear()}}).then(function(r){return r})}
function closeM(){$("modal").classList.remove("open")}
$("modal").onclick=function(e){if(e.target==this)closeM()};
function msgHtml(){var h=MSG?'<div class="msg '+(MSG.e?"e":"i")+'">'+esc(MSG.t)+'</div>':"";MSG=null;return h}

/* ----- Empreinte digitale / biométrie de l’appareil ----- */
function rb(n){return crypto.getRandomValues(new Uint8Array(n))}
function b2s(b){return btoa(String.fromCharCode.apply(null,new Uint8Array(b))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
function s2b(s){s=s.replace(/-/g,"+").replace(/_/g,"/")+"=".repeat((4-s.length%4)%4);var t=atob(s),a=new Uint8Array(t.length);for(var i=0;i<t.length;i++)a[i]=t.charCodeAt(i);return a}
function dvGet(){try{return JSON.parse(localStorage.getItem("dv")||"null")}catch(e){return null}}
function bioActiver(){
  if(!window.PublicKeyCredential||!navigator.credentials)return flash("Cet appareil ou ce navigateur ne gère pas l’empreinte digitale.",1);
  navigator.credentials.create({publicKey:{challenge:rb(32),rp:{name:"Espace Personnel RH"},user:{id:rb(16),name:U.nom,displayName:U.nom},pubKeyCredParams:[{type:"public-key",alg:-7},{type:"public-key",alg:-257}],authenticatorSelection:{authenticatorAttachment:"platform",userVerification:"required"},timeout:60000}})
   .then(function(cr){return call("appareil_enregistrer",{nom:navigator.userAgent}).then(function(r){localStorage.setItem("dv",JSON.stringify({aid:r.appareil_id,tok:r.jeton,cid:b2s(cr.rawId),nom:U.nom}));MSG={t:"Empreinte digitale activée sur cet appareil."};render()})})
   .catch(function(e){flash("Activation annulée ou impossible. Vérifiez qu’une empreinte ou un verrouillage d’écran est configuré sur l’appareil.",1)})}
function bioRetirer(){var d=dvGet();(d?call("appareil_retirer",{id:d.aid}):Promise.resolve()).catch(function(){}).then(function(){localStorage.removeItem("dv");MSG={t:"Empreinte digitale désactivée sur cet appareil."};render()})}
function bioLogin(){var d=dvGet();if(!d)return;
  navigator.credentials.get({publicKey:{challenge:rb(32),allowCredentials:[{type:"public-key",id:s2b(d.cid),transports:["internal"]}],userVerification:"required",timeout:60000}})
   .then(function(){return call("login_appareil",{appareil_id:d.aid,jeton:d.tok})})
   .then(function(u){U=u;sessionStorage.setItem("u",JSON.stringify(u));start()})
   .catch(function(e){var m=/Appareil non reconnu|désactivé/.test(e.message);if(m)localStorage.removeItem("dv");MSG={t:m?e.message:"Empreinte non reconnue ou annulée. Utilisez votre mot de passe.",e:1};loginView()})}


function qrSvg(c){try{var q=qrcode(0,"M");q.addData(location.origin+location.pathname+"?v="+c);q.make();return q.createSvgTag(3,0)}catch(e){return""}}
function qrBlock(c){if(!c)return"";var s=qrSvg(c);return'<div style="display:flex;gap:10px;align-items:center;margin-top:14px;font-size:11px;color:#445">'+(s?'<div class="qr" style="width:84px;flex:0 0 auto">'+s+'</div>':'')+'<div>Pour vérifier l’authenticité de ce document, scannez le QR code.<br>Code de vérification : <b>'+esc(c)+'</b></div></div>'}
function enteteHtml(en){return'<div class="top"><div style="display:flex;gap:10px;align-items:center">'+(en.logo?'<img src="'+en.logo+'" alt="" style="height:56px;max-width:90px;object-fit:contain">':"")+'<div><b>'+esc(en.pays)+'</b><br>'+esc(en.ligne1)+'<br>'+esc(en.ligne2)+'</div></div><div style="text-align:right">'+[en.adresse,en.tel&&"Tél : "+en.tel,en.mail,en.site].filter(Boolean).map(esc).join("<br>")+'</div></div>'}
function signBlock(t){return'<div class="sign">Le Responsable des Ressources Humaines<svg width="150" height="46" viewBox="0 0 150 46" aria-hidden="true"><path d="M6 32c14-30 22-28 20-8-1 12 10 4 16-6 4-6 6 6 14 2 8-5 12-9 20-2 6 5 14 0 24-8" fill="none" stroke="#1F3A8A" stroke-width="2.2" stroke-linecap="round"/></svg>Signé électroniquement le '+esc(t)+'</div>'}
function welcome(){if(localStorage.getItem("welcome"))return"";return'<div class="card"><h2>Bienvenue 👋</h2><p class="sub" style="margin-top:0">Voici l’essentiel :<br>• <b>Demandes</b> : faites une demande de congé ou de permission et suivez sa validation.<br>• <b>Dossier</b> : retrouvez vos pièces administratives.<br>• <b>Attestations</b> : obtenez une attestation tout de suite.<br>• Le bouton 🔔 vous prévient dès qu’une demande est traitée.<br>• <b>A+</b> agrandit le texte. Le guide complet est dans <b>Aide</b>.</p><button class="btn sm" id="wl">J’ai compris</button></div>'}
function showAtt(r){var a=r.agent,en=r.entete,T={TRAVAIL:"ATTESTATION DE TRAVAIL",PRESENCE:"ATTESTATION DE PRÉSENCE",NON_CONGE:"ATTESTATION DE NON-JOUISSANCE DE CONGÉ"},nom=esc(a.prenoms+" "+String(a.nom).toUpperCase());
  var txt={TRAVAIL:"atteste que <b>"+nom+"</b>, matricule <b>"+esc(a.matricule)+"</b>, <b>"+esc(a.emploi)+"</b>, est en service à <b>"+esc(a.structure)+"</b> depuis le <b>"+fd(a.date_prise_service)+"</b>.",
   PRESENCE:"atteste que <b>"+nom+"</b>, matricule <b>"+esc(a.matricule)+"</b>, <b>"+esc(a.emploi)+"</b>, est présent(e) à son poste et en activité à <b>"+esc(a.structure)+"</b> à la date du <b>"+fd(r.date)+"</b>.",
   NON_CONGE:"atteste que <b>"+nom+"</b>, matricule <b>"+esc(a.matricule)+"</b>, <b>"+esc(a.emploi)+"</b>, en service à <b>"+esc(a.structure)+"</b>, n’a bénéficié d’aucun congé annuel au cours de l’année <b>"+esc(r.annee)+"</b>."}[r.type];
  $("sheet").className="sheet att";$("sheet").innerHTML=enteteHtml(en)+'<hr><h3>'+T[r.type]+'</h3><p style="margin-top:18px">Le Responsable des Ressources Humaines de <b>'+esc(en.ligne2)+'</b> '+txt+'</p><p>En foi de quoi la présente attestation lui est délivrée pour servir et valoir ce que de droit.</p><div style="margin-top:14px">Fait à '+esc(en.lieu)+', le '+fd(r.date)+'</div>'+signBlock(fd(r.date))+qrBlock(r.code)+'<div class="acts noprint" style="margin-top:14px"><button class="btn" onclick="window.print()">Télécharger en PDF</button><button class="btn s" onclick="closeM()">Fermer</button></div>';$("modal").classList.add("open")}
function dl(name,rows){var s=rows.map(function(r){return r.map(function(c){return'"'+String(c==null?"":c).replace(/"/g,'""')+'"'}).join(";")}).join("\n"),a=document.createElement("a");a.href="data:text/csv;charset=utf-8,\ufeff"+encodeURIComponent(s);a.download=name;a.click()}
function vNot(){var n=D.nots||[];return'<div class="card"><h2>Notifications</h2>'+(n.length?n.map(function(x){return'<div class="it"><div><b>'+(x.lu=="NON"?"● ":"")+esc(x.titre)+'</b><span class="sub">'+esc(x.message)+' · '+fd(x.date)+'</span></div></div>'}).join(""):'<div class="sub">Aucune notification pour le moment.</div>')+'</div>'}
function vAtt(){return'<div class="card"><h2>Attestations</h2><p class="sub" style="margin-top:0">Obtenez immédiatement une attestation avec signature électronique et QR code de vérification.</p><div class="acts" style="justify-content:flex-start"><button class="btn" data-at="TRAVAIL">Attestation de travail</button><button class="btn s" data-at="PRESENCE">Attestation de présence</button><button class="btn s" data-at="NON_CONGE">Non-jouissance de congé</button></div></div>'}
function vAid(){return'<div class="card"><h2>Aide</h2><p>Le guide d’utilisation complet explique chaque écran, pas à pas.</p><a class="btn" href="guide.html" target="_blank" style="display:inline-block;text-decoration:none">Ouvrir le guide d’utilisation</a><p class="sub">Dans le guide, utilisez « Imprimer » pour l’enregistrer en PDF.</p></div><div class="card"><h2>Questions fréquentes</h2><div class="dv"><b>J’ai oublié mon mot de passe.</b><br><span class="sub">Contactez le gestionnaire RH ou l’administrateur de votre structure : il vous donnera un nouveau mot de passe.</span></div><div class="dv"><b>Ma demande est refusée.</b><br><span class="sub">Le motif est indiqué dans « Demandes ». Vous pouvez refaire une demande corrigée.</span></div><div class="dv"><b>Je ne vois pas « Mes fiches de paie ».</b><br><span class="sub">Cet onglet existe seulement si votre salaire est financé par votre structure.</span></div><div class="dv"><b>Comment vérifier un document ?</b><br><span class="sub">Scannez le QR code imprimé sur le document avec l’appareil photo du téléphone.</span></div></div>'}
function vDash(){var d=D.dash||{},li=function(a,f){return a&&a.length?a.map(f).join(""):'<div class="sub">Rien à signaler.</div>'};
  return'<div class="kpi"><div><strong>'+d.effectif+'</strong><span class="sub">agents en activité</span></div><div><strong>'+d.absents.length+'</strong><span class="sub">absents aujourd’hui</span></div><div><strong>'+(d.attente_rh+d.attente_chef)+'</strong><span class="sub">demandes en attente</span></div></div>'
  +'<div class="card"><h2>Absents aujourd’hui</h2>'+li(d.absents,function(x){return'<div class="it"><div><b>'+esc(x.agent)+'</b><span class="sub">'+esc(x.type)+' · jusqu’au '+fd(x.fin)+(x.service?' · '+esc(x.service):'')+'</span></div></div>'})+'</div>'
  +'<div class="card"><h2>Calendrier : 30 prochains jours</h2>'+li(d.avenir,function(x){return'<div class="it"><div><b>'+esc(x.agent)+'</b><span class="sub">'+esc(x.type)+' · du '+fd(x.debut)+' au '+fd(x.fin)+'</span></div></div>'})+'</div>'
  +'<div class="card"><h2>Départs à la retraite (24 mois)</h2><div class="sub">Âge retenu : '+d.age_retraite+' ans (modifiable dans Parametres)</div>'+li(d.retraites,function(x){return'<div class="it"><b>'+esc(x.agent)+'</b><span class="sub">'+fd(x.date)+'</span></div>'})+'</div>'
  +'<div class="card"><h2>Avancements à étudier (6 mois)</h2><div class="sub">Tous les '+d.duree_echelon+' ans de service (modifiable dans Parametres)</div>'+li(d.avancements,function(x){return'<div class="it"><div><b>'+esc(x.agent)+'</b><span class="sub">'+esc(x.grade)+'</span></div><span class="sub">'+fd(x.date)+'</span></div>'})+'</div>'
  +'<div class="card"><h2>Exports Excel</h2><div class="acts" style="justify-content:flex-start"><button class="btn s sm" id="x1">Soldes de congés</button><button class="btn s sm" id="x2">Liste des agents</button><button class="btn s sm" id="x3">Toutes les demandes</button></div></div>'}
var RUB=[["SOLDE_BRUTE","SOLDE BRUTE","GAIN"],["IND_RESIDENCE","IND. RESIDENCE","GAIN"],["IND_LOGEMENT","IND. LOGEMENT","GAIN"],["IND_RISQUE","IND RISQUE NON ABATTU","GAIN"],["PRIME_QUALIF","PRIME DE QUALIFICATION","GAIN"],["PRIME_RENDEMENT","PRIME DE RENDEMENT","GAIN"],["CNSS_PAT","FONDS CNSS DE RET PART PATRONALE","PATRONAL"],["ITS","ITS","RETENUE"],["CNSS_OUV","FONDS NAT DE RET PART OUVR","RETENUE"],["ORTB","ORTB","RETENUE"]].map(function(r){return{code:r[0],libelle:r[1],sens:r[2]}});
function vEnt(){var s=D.entSel,e=(s&&s.entete)||{},f=function(id,l,v,ph){return'<label>'+l+'<input id="'+id+'" value="'+esc(v)+'" placeholder="'+esc(ph||"")+'"></label>'};
  return'<div class="card"><h2>En-tête de la fiche de paie</h2><div class="note">Le canevas du bulletin reste identique. Vous personnalisez ici l’en-tête qui apparaît sur les fiches de paie, attestations et titres de <b>votre structure</b>.</div>'
  +(U.role=="ADMIN"?'<label>Structure<select id="es">'+(D.str||[]).map(function(t){return'<option value="'+esc(t.code)+'"'+(t.code==D.es?" selected":"")+'>'+esc(t.nom)+'</option>'}).join("")+'</select></label>':'<div class="sub">Structure : <b>'+esc(s&&s.nom)+'</b></div>')
  +f("e1","Pays / institution",e.pays)+f("e2","Ligne 1 (ex. ministère)",e.ligne1)+f("e3","Ligne 2 (nom de la structure)",e.ligne2)+f("e4","Adresse postale",e.adresse,"BP 01-882")+'<div class="g2">'+f("e5","Téléphone",e.tel)+f("e6","E-mail",e.mail)+'</div>'+f("e7","Site web",e.site)+f("e8","Lieu d’édition (« Fait à … »)",e.lieu)+f("e9","Texte par défaut de « Informations supplémentaires »",e.infos)
  +'<label>Logo de la structure (image)<input type="file" id="e_logo" accept="image/*"></label>'+(e.logo?'<div style="margin-bottom:10px"><img src="'+e.logo+'" alt="" style="height:48px"> <button class="btn s sm" id="e_rl">Retirer le logo</button></div>':'')
  +'<div class="acts" style="justify-content:flex-start"><button class="btn s" id="e_ap">Aperçu de la fiche</button><button class="btn" id="e_sv">Enregistrer</button></div></div>'}

function verifyView(c){$("app").innerHTML='<div class="login"><img src="icons/icon-192.png" alt=""><h1>Vérification d’un document</h1><p>Espace Personnel</p><div class="card" id="vr">Vérification en cours…</div><a class="btn s" href="'+location.pathname+'" style="display:block;text-align:center;text-decoration:none">Ouvrir l’application</a></div>';
